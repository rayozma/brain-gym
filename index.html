<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Brain Gym</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&family=Fraunces:opsz,wght@9..144,500;9..144,650&display=swap" rel="stylesheet">
<style>
:root{--bg:#f6f3ec;--card:#fffdf8;--ink:#1f1d1a;--mute:#6d675d;--line:#e3ddd0;--code:#2f6b4f;--codebg:#e6efe9;--math:#4b4fa8;--mathbg:#e9e9f6;--ok:#2f7a45;--bad:#b3412e;--warn:#9a6a12;--field:#fbf9f4}
@media (prefers-color-scheme:dark){:root{--bg:#171614;--card:#201f1c;--ink:#ece7dd;--mute:#a39c8f;--line:#35322c;--code:#7cc59c;--codebg:#1f2e26;--math:#a5a8f0;--mathbg:#25263a;--ok:#6fcf8a;--bad:#ef8a75;--warn:#e0b45a;--field:#191816}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 "IBM Plex Sans",system-ui,sans-serif}
.wrap{max-width:860px;margin:0 auto;padding:20px 16px 60px}
header{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:18px}
h1,h2,h3{font-family:Fraunces,Georgia,serif;font-weight:650;letter-spacing:-.01em;margin:0}
h1{font-size:28px}h2{font-size:22px;margin-bottom:6px}h3{font-size:17px}
nav{display:flex;gap:4px;flex-wrap:wrap}
nav button{background:none;border:1px solid transparent;color:var(--mute);padding:6px 12px;border-radius:999px;font:inherit;font-size:14px;cursor:pointer}
nav button.on{border-color:var(--line);background:var(--card);color:var(--ink)}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px}
.muted{color:var(--mute)}.small{font-size:14px}
.tag{display:inline-block;font-size:12px;font-weight:500;padding:2px 8px;border-radius:999px;margin-right:6px;border:1px solid var(--line);color:var(--mute)}
.tag.code{background:var(--codebg);color:var(--code);border-color:transparent}
.tag.math{background:var(--mathbg);color:var(--math);border-color:transparent}
.btn{font:inherit;font-size:15px;font-weight:500;padding:8px 16px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer}
.btn.primary{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.btn:disabled{opacity:.5;cursor:default}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.task{display:flex;flex-direction:column;gap:8px}
.task .kind{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--mute);font-weight:600}
.done{opacity:.6}
.statement{font-size:17px;margin:12px 0}
code,textarea.ed,pre{font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:14px}
.statement code,.note code{background:var(--field);border:1px solid var(--line);padding:0 5px;border-radius:5px}
textarea.ed{width:100%;min-height:200px;padding:12px;border:1px solid var(--line);border-radius:10px;background:var(--field);color:var(--ink);line-height:1.5;resize:vertical;tab-size:4}
input[type=text],textarea.note-in{font:inherit;padding:8px 10px;border:1px solid var(--line);border-radius:10px;background:var(--field);color:var(--ink)}
textarea.note-in{width:100%;min-height:60px}
.hint{border-left:3px solid var(--warn);padding:6px 12px;margin:8px 0;background:var(--field);border-radius:0 8px 8px 0}
.sol{border-left:3px solid var(--ok);padding:8px 12px;margin:8px 0;background:var(--field);border-radius:0 8px 8px 0}
pre{background:var(--field);border:1px solid var(--line);border-radius:10px;padding:10px 12px;overflow-x:auto;white-space:pre}
table{width:100%;border-collapse:collapse;font-size:14px}
td,th{text-align:left;padding:6px 8px;border-bottom:1px solid var(--line);vertical-align:top}
td.mono{font-family:"IBM Plex Mono",monospace;word-break:break-all}
.ok{color:var(--ok);font-weight:600}.bad{color:var(--bad);font-weight:600}
.msg{padding:10px 12px;border-radius:10px;margin:10px 0;background:var(--field);border:1px solid var(--line)}
.msg.bad{border-color:var(--bad)}.msg.ok{border-color:var(--ok)}
.feel button{min-width:78px}.feel button.on{background:var(--ink);color:var(--bg)}
.list .item{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:10px 4px;border-bottom:1px solid var(--line);cursor:pointer}
.list .item:hover{background:var(--field)}
.dot{width:10px;height:10px;border-radius:50%;display:inline-block;margin-right:8px;border:1.5px solid var(--mute)}
.dot.seen{background:var(--warn);border-color:var(--warn)}.dot.solved{background:var(--ok);border-color:var(--ok)}
.timer{font-family:"IBM Plex Mono",monospace;color:var(--mute);font-size:14px}
.sec{margin-top:16px}
a{color:inherit}
@media (max-width:560px){h1{font-size:24px}.statement{font-size:16px}}
</style>
</head>
<body>
<div class="wrap">
<header><div><h1>Brain Gym</h1><div class="muted small" id="sub"></div></div>
<nav id="nav"><button data-v="today">Today</button><button data-v="library">Library</button><button data-v="notebook">Notebook</button><button data-v="data">Data</button></nav></header>
<main id="main"></main>
</div>
<script src="problems.js"></script>
<script>
const HARNESS = "import json, copy, io, contextlib, traceback\ndef _bg_where(tb):\n    ln = None\n    for fr in traceback.extract_tb(tb):\n        if fr.filename == \"<your code>\": ln = fr.lineno\n    return f\" (line {ln})\" if ln else \"\"\ndef _bg_same(a, exp):\n    if isinstance(exp, bool) or exp is None: return a is exp\n    if isinstance(a, bool): return False\n    if isinstance(a, float) or isinstance(exp, float):\n        try: return abs(a - exp) < 1e-9\n        except Exception: return False\n    return a == exp\ndef _bg_run(code, fname, tests_json):\n    tests = json.loads(tests_json); out = io.StringIO(); res = []\n    try:\n        with contextlib.redirect_stdout(out): exec(compile(code, \"<your code>\", \"exec\"), (g := {}))\n    except SyntaxError as e:\n        return json.dumps({\"error\": f\"SyntaxError (line {e.lineno}): {e.msg}\", \"stdout\": out.getvalue(), \"results\": []})\n    except Exception as e:\n        return json.dumps({\"error\": f\"{type(e).__name__}{_bg_where(e.__traceback__)}: {e}\", \"stdout\": out.getvalue(), \"results\": []})\n    f = g.get(fname)\n    if not callable(f):\n        return json.dumps({\"error\": f\"I cannot find the function '{fname}'. Keep the name from the starter code.\", \"stdout\": out.getvalue(), \"results\": []})\n    for args, exp in tests:\n        r = {\"args\": \", \".join(repr(a) for a in args), \"expected\": repr(exp)}\n        try:\n            with contextlib.redirect_stdout(out): got = f(*copy.deepcopy(args))\n            r[\"got\"] = repr(got); r[\"ok\"] = _bg_same(got, exp)\n        except Exception as e:\n            r[\"got\"] = f\"{type(e).__name__}{_bg_where(e.__traceback__)}: {e}\"; r[\"ok\"] = False\n        res.append(r)\n    return json.dumps({\"error\": None, \"stdout\": out.getvalue()[:4000], \"results\": res})\n";
const P = window.PROBLEMS, byId = Object.fromEntries(P.map(p => [p.id, p]));
const KEY = 'braingym.v1', INTERVALS = [1, 3, 7, 16, 35, 75];
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt = s => esc(s).replace(/\*\*(.+?)\*\*/g, '<b>$1</b>').replace(/`([^`]+)`/g, '<code>$1</code>');
const today = () => { const d = new Date(); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; };
const addDays = (iso, n) => { const d = new Date(iso + 'T12:00:00'); d.setDate(d.getDate() + n); return d.toISOString().slice(0, 10); };
let S = load();
function load() { try { const s = JSON.parse(localStorage.getItem(KEY)); if (s && s.v === 1) return s; } catch (e) {} return { v: 1, items: {}, log: [], drafts: {}, firstDay: today() }; }
function save() { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) { alert('Could not save in this browser. Use Data → Export to keep your work.'); } }
const it = id => S.items[id] || null;

function todayPlan() {
  const t = today(), doneToday = new Set(S.log.filter(l => l.date === t).map(l => l.id));
  const due = Object.entries(S.items).filter(([id, x]) => byId[id] && x.due <= t && !doneToday.has(id)).sort((a, b) => a[1].due.localeCompare(b[1].due));
  const reviewDone = S.log.some(l => l.date === t && l.review);
  const review = reviewDone ? null : (due[0] ? due[0][0] : null);
  const newDone = S.log.some(l => l.date === t && !l.review);
  const days = Math.round((new Date(t) - new Date(S.firstDay)) / 864e5);
  const pref = days % 2 === 0 ? 'math' : 'code';
  const fresh = tr => P.find(p => p.track === tr && !it(p.id));
  const nxt = newDone ? null : (fresh(pref) || fresh(pref === 'math' ? 'code' : 'math') || null);
  return { review, reviewDone, nxt: nxt && nxt.id, newDone, pref };
}

function setNav(v) { document.querySelectorAll('#nav button').forEach(b => b.classList.toggle('on', b.dataset.v === v)); }
document.querySelectorAll('#nav button').forEach(b => b.onclick = () => go(b.dataset.v));
function go(v, arg) { stopTimer(); setNav(v); ({ today: vToday, library: vLibrary, notebook: vNotebook, data: vData, problem: vProblem })[v](arg); window.scrollTo(0, 0); }
function sub() { const n = new Set(S.log.map(l => l.date)).size, solved = Object.values(S.items).filter(x => x.solved).length; $('#sub').textContent = `${solved} of ${P.length} problems solved · ${n} training day${n === 1 ? '' : 's'}`; }

function taskCard(kind, id, done, empty) {
  if (!id) return `<div class="card task ${done ? 'done' : ''}"><div class="kind">${kind}</div><h3>${done ? 'Done ✓' : 'Nothing here'}</h3><div class="muted small">${done ? 'Good work.' : empty}</div></div>`;
  const p = byId[id];
  return `<div class="card task"><div class="kind">${kind}</div><div><span class="tag ${p.track}">${p.track === 'code' ? 'Code' : 'Math'}</span><span class="tag">${esc(p.topic)}</span><span class="tag">Level ${p.level}</span></div><h3>${esc(p.title)}</h3><div><button class="btn primary" onclick="go('problem',{id:'${id}',review:${kind === 'Review'}})">Start</button></div></div>`;
}
function vToday() {
  sub(); const pl = todayPlan(), all = (pl.reviewDone || !pl.review) && (pl.newDone || !pl.nxt);
  $('#main').innerHTML = `<p class="muted">${all ? 'Today\'s session is complete. You can still pick any task in the Library.' : 'About 10 minutes: one review, one new problem. Do them in any order.'}</p>
  <div class="grid">${taskCard('Review', pl.review, pl.reviewDone, 'No problem is due for review today.')}${taskCard('New problem', pl.nxt, pl.newDone, 'You have tried every problem. Add more to problems.js.')}</div>
  <p class="small muted sec">Want something else? <a href="#" onclick="go('library');return false">Choose any task in the Library</a>.</p>`;
}
function status(id) { const x = it(id); return !x ? '' : x.solved ? 'solved' : 'seen'; }
let libFilter = 'all';
function vLibrary() {
  sub(); const t = today();
  const rows = P.filter(p => libFilter === 'all' || p.track === libFilter).map(p => { const x = it(p.id);
    return `<div class="item" onclick="go('problem',{id:'${p.id}',review:${!!x}})"><div><span class="dot ${status(p.id)}"></span>${esc(p.title)} <span class="tag ${p.track}">${p.track === 'code' ? 'Code' : 'Math'}</span><span class="tag">${esc(p.topic)}</span><span class="tag">L${p.level}</span></div><div class="small muted" style="white-space:nowrap">${x ? (x.due <= t ? 'review due' : 'next ' + x.due.slice(5)) : 'new'}</div></div>`; }).join('');
  $('#main').innerHTML = `<div class="row" style="margin-bottom:10px">${['all', 'math', 'code'].map(f => `<button class="btn ${libFilter === f ? 'primary' : ''}" onclick="libFilter='${f}';vLibrary()">${f === 'all' ? 'All' : f === 'math' ? 'Math' : 'Code'}</button>`).join('')}</div>
  <div class="card list">${rows}</div><p class="small muted">Grey: new · yellow: tried · green: solved. The path goes from top to bottom.</p>`;
}
function vNotebook() {
  sub(); let mOnly = vNotebook.m || false;
  const rows = [...S.log].reverse().filter(l => !mOnly || l.feel === 'failed' || l.feel === 'hard').map(l => { const p = byId[l.id]; if (!p) return '';
    return `<tr><td class="small muted" style="white-space:nowrap">${l.date}</td><td><a href="#" onclick="go('problem',{id:'${l.id}',review:true});return false">${esc(p.title)}</a><div class="small muted">${l.result} · ${l.feel} · ${Math.round(l.secs / 60)} min</div></td><td class="note">${fmt(l.note || '')}</td></tr>`; }).join('');
  $('#main').innerHTML = `<div class="row" style="margin-bottom:10px"><label class="small"><input type="checkbox" ${mOnly ? 'checked' : ''} onchange="vNotebook.m=this.checked;vNotebook()"> Only hard and failed (mistake notebook)</label></div>
  <div class="card">${rows ? `<table><tr><th>Date</th><th>Problem</th><th>Key idea / mistake</th></tr>${rows}</table>` : '<p class="muted">No entries yet. Each finished task adds one line here.</p>'}</div>`;
}
function vData() {
  sub();
  $('#main').innerHTML = `<div class="card"><h2>Backup</h2><p class="small">Your progress is saved only in this browser. A browser can delete it (cleared history, private mode, new device). Export a backup file from time to time.</p>
  <div class="row"><button class="btn primary" onclick="exportData()">Export backup</button><label class="btn">Import backup<input type="file" accept=".json" hidden onchange="importData(this.files[0])"></label></div>
  <h2 class="sec">Reset</h2><p class="small">Delete all progress in this browser. Export first if you want to keep it.</p><button class="btn" style="color:var(--bad)" onclick="if(confirm('Delete all progress?')){S={v:1,items:{},log:[],drafts:{},firstDay:today()};save();go('today')}">Delete all progress</button>
  <h2 class="sec">Add problems</h2><p class="small">Problems are in <code>problems.js</code>. Add a new object with a new <code>id</code>. New problems appear in the Library and in the daily plan. Do not change the <code>id</code> of an old problem, because your progress uses it.</p></div>`;
}
function exportData() { const b = new Blob([JSON.stringify(S, null, 1)], { type: 'application/json' }), a = document.createElement('a'); a.href = URL.createObjectURL(b); a.download = `braingym-backup-${today()}.json`; a.click(); URL.revokeObjectURL(a.href); }
function importData(f) { if (!f) return; f.text().then(t => { const s = JSON.parse(t); if (s.v !== 1 || !s.items || !s.log) throw 0; if (confirm('Replace your current progress with this backup?')) { S = s; save(); go('today'); } }).catch(() => alert('This file is not a Brain Gym backup.')); }

let timerId = null, t0 = 0;
function stopTimer() { if (timerId) clearInterval(timerId); timerId = null; }
function startTimer() { t0 = Date.now(); timerId = setInterval(() => { const s = Math.floor((Date.now() - t0) / 1000), el = $('#timer'); if (el) el.textContent = `${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}`; }, 1000); }

let cur = null;
function vProblem({ id, review }) {
  const p = byId[id]; cur = { p, review, hints: 0, solved: false, shownSol: false, feel: null };
  const ex = p.track === 'code' ? p.tests.slice(0, 2).map(([a, e]) => `<code>${esc(p.fname)}(${esc(a.map(x => JSON.stringify(x).replace(/\btrue\b/g,'True').replace(/\bfalse\b/g,'False').replace(/\bnull\b/g,'None')).join(', '))})</code> → <code>${esc(JSON.stringify(e).replace(/\btrue\b/g,'True').replace(/\bfalse\b/g,'False').replace(/\bnull\b/g,'None'))}</code>`).join('<br>') : '';
  $('#main').innerHTML = `<div class="row" style="justify-content:space-between;margin-bottom:10px"><button class="btn" onclick="go('today')">← Back</button><span class="timer" id="timer">0:00</span></div>
  <div class="card"><div><span class="tag ${p.track}">${p.track === 'code' ? 'Code' : 'Math'}</span><span class="tag">${esc(p.topic)}</span><span class="tag">Level ${p.level}</span>${review ? '<span class="tag">Review</span>' : ''}</div>
  <h2 style="margin-top:8px">${esc(p.title)}</h2><div class="statement">${fmt(p.statement)}</div>${ex ? `<div class="small muted">Examples:</div><div class="small">${ex}</div>` : ''}
  ${p.track === 'code' ? `<div class="sec"><textarea class="ed" id="ed" spellcheck="false" autocapitalize="off" autocomplete="off"></textarea>
   <div class="row" style="margin-top:8px"><button class="btn primary" id="run" onclick="runCode()">Run tests</button><span class="small muted">Ctrl+Enter also runs. Tab adds 4 spaces.</span><span class="small muted" id="pystat"></span></div><div id="out"></div></div>`
   : `<div class="sec row"><input type="text" id="ans" inputmode="numeric" placeholder="Your answer" onkeydown="if(event.key==='Enter')checkMath()"><button class="btn primary" onclick="checkMath()">Check</button></div><div id="out"></div>
   <p class="small muted">Use paper. Write small cases. Then type only the final number.</p>`}
  <div class="sec row"><button class="btn" id="hintb" onclick="showHint()">Show a hint (${p.hints.length} left)</button><button class="btn" onclick="showSol()">Show solution</button></div><div id="hints"></div><div id="sol"></div></div>
  <div class="card sec" id="logc"><h3>Log it</h3><p class="small muted">How did it feel? This decides when the problem comes back for review.</p>
  <div class="row feel">${[['failed','Failed'],['hard','Hard'],['ok','OK'],['easy','Easy']].map(([k, l]) => `<button class="btn" data-f="${k}" onclick="pickFeel('${k}')">${l}</button>`).join('')}</div>
  <p class="small muted" style="margin:12px 0 6px">One sentence: the key idea, or your mistake.</p><textarea class="note-in" id="note" placeholder="e.g. Test the 'both' case first."></textarea>
  <div class="row" style="margin-top:10px"><button class="btn primary" id="savelog" onclick="saveLog()" disabled>Save and finish</button><span class="small muted" id="logmsg"></span></div></div>`;
  if (p.track === 'code') { const ed = $('#ed'); ed.value = S.drafts[id] ?? p.starter; setupEditor(ed); ensurePy(); }
  startTimer();
}
function showHint() { const p = cur.p; if (cur.hints >= p.hints.length) return; $('#hints').insertAdjacentHTML('beforeend', `<div class="hint small"><b>Hint ${cur.hints + 1}.</b> ${fmt(p.hints[cur.hints])}</div>`); cur.hints++; const b = $('#hintb'); b.textContent = cur.hints >= p.hints.length ? 'No more hints' : `Show a hint (${p.hints.length - cur.hints} left)`; b.disabled = cur.hints >= p.hints.length; }
function showSol() { if (cur.shownSol) return; if (!cur.solved && !confirm('Show the solution? Try a hint first if you have not.')) return; cur.shownSol = true; const p = cur.p;
  $('#sol').innerHTML = `<div class="sol small"><b>Solution.</b> ${p.track === 'math' ? `Answer: <b>${p.answer}</b>. ` : ''}${fmt(p.solution)}</div>${p.solutionCode ? `<pre>${esc(p.solutionCode)}</pre>` : ''}`; }
function checkMath() { const v = $('#ans').value.trim().replace(/,/g, ''); if (!v) return; const ok = Number(v) === cur.p.answer;
  if (ok) cur.solved = true; cur.tries = (cur.tries || 0) + 1;
  $('#out').innerHTML = `<div class="msg ${ok ? 'ok' : 'bad'}">${ok ? 'Correct.' : 'Not correct. Check your work, or take a hint.'}</div>`; }
function pickFeel(k) { cur.feel = k; document.querySelectorAll('.feel button').forEach(b => b.classList.toggle('on', b.dataset.f === k)); $('#savelog').disabled = false; }
function saveLog() {
  const p = cur.p, t = today(), x = S.items[p.id] || { box: 0, due: t, attempts: 0, solved: false };
  let box = x.attempts ? x.box : 0;
  box = { failed: 0, hard: Math.max(0, box - 1), ok: box + 1, easy: box + 2 }[cur.feel]; box = Math.min(box, INTERVALS.length - 1);
  const result = cur.solved ? (cur.shownSol ? 'solved after solution' : cur.hints ? `solved with ${cur.hints} hint${cur.hints > 1 ? 's' : ''}` : 'solved') : 'not solved';
  S.items[p.id] = { box, due: addDays(t, INTERVALS[box]), attempts: x.attempts + 1, solved: x.solved || cur.solved };
  S.log.push({ date: t, id: p.id, review: !!cur.review, result, feel: cur.feel, note: $('#note').value.trim(), secs: Math.round((Date.now() - t0) / 1000) });
  save(); go('today');
}

function setupEditor(ed) {
  ed.addEventListener('input', () => { S.drafts[cur.p.id] = ed.value; save(); });
  ed.addEventListener('keydown', e => {
    if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') { e.preventDefault(); runCode(); return; }
    const s = ed.selectionStart, v = ed.value;
    if (e.key === 'Tab') { e.preventDefault(); ed.setRangeText('    ', s, ed.selectionEnd, 'end'); ed.dispatchEvent(new Event('input')); }
    else if (e.key === 'Enter') { const ls = v.lastIndexOf('\n', s - 1) + 1, line = v.slice(ls, s), ind = line.match(/^ */)[0] + (/:\s*$/.test(line) ? '    ' : '');
      e.preventDefault(); ed.setRangeText('\n' + ind, s, ed.selectionEnd, 'end'); ed.dispatchEvent(new Event('input')); }
    else if (e.key === 'Backspace' && s === ed.selectionEnd && s >= 4 && v.slice(s - 4, s) === '    ' && /^ *$/.test(v.slice(v.lastIndexOf('\n', s - 1) + 1, s))) { e.preventDefault(); ed.setRangeText('', s - 4, s, 'end'); ed.dispatchEvent(new Event('input')); }
  });
}

const PYODIDE = 'https://cdn.jsdelivr.net/pyodide/v0.27.2/full/';
const WORKER_SRC = `importScripts('${PYODIDE}pyodide.js');
let py = loadPyodide({ indexURL: '${PYODIDE}' }).then(async p => { await p.runPythonAsync(${JSON.stringify(HARNESS)}); return p; });
py.then(() => postMessage({ ready: true }), e => postMessage({ fail: String(e) }));
onmessage = async e => { const p = await py; try { postMessage({ id: e.data.id, out: p.globals.get('_bg_run')(e.data.code, e.data.fname, e.data.tests) }); } catch (err) { postMessage({ id: e.data.id, out: JSON.stringify({ error: String(err), stdout: '', results: [] }) }); } };`;
let worker = null, pyReady = false, pending = null, reqId = 0;
function pyStat(t) { const el = $('#pystat'); if (el) el.textContent = t; }
function ensurePy() {
  if (worker) { pyStat(pyReady ? '' : 'Loading Python…'); return; }
  pyReady = false; pyStat('Loading Python (first time takes a few seconds)…');
  worker = new Worker(URL.createObjectURL(new Blob([WORKER_SRC], { type: 'text/javascript' })));
  worker.onmessage = e => { const d = e.data;
    if (d.ready) { pyReady = true; pyStat(''); return; }
    if (d.fail) { pyStat('Python could not load. Check your internet connection, then reload the page.'); worker = null; return; }
    if (pending && d.id === pending.id) { clearTimeout(pending.timer); const cb = pending.cb; pending = null; cb(JSON.parse(d.out)); } };
}
function runCode() {
  if (pending) return; ensurePy(); const p = cur.p, btn = $('#run'); btn.disabled = true; btn.textContent = pyReady ? 'Running…' : 'Waiting for Python…';
  const id = ++reqId, limit = pyReady ? 6000 : 60000;
  const timer = setTimeout(() => { pending = null; worker.terminate(); worker = null; pyReady = false; btn.disabled = false; btn.textContent = 'Run tests';
    $('#out').innerHTML = `<div class="msg bad">Your code ran too long. Maybe a loop never stops? Python restarts now.</div>`; ensurePy(); }, limit);
  pending = { id, timer, cb: r => { btn.disabled = false; btn.textContent = 'Run tests'; showRun(r); } };
  worker.postMessage({ id, code: $('#ed').value, fname: p.fname, tests: JSON.stringify(p.tests) });
}
function showRun(r) {
  let h = '';
  if (r.error) h = `<div class="msg bad"><b>Error.</b> ${esc(r.error)}</div>`;
  else { const n = r.results.filter(x => x.ok).length, all = n === r.results.length; if (all) cur.solved = true;
    h = `<div class="msg ${all ? 'ok' : 'bad'}">${all ? `All ${n} tests passed. Well done.` : `${n} of ${r.results.length} tests passed.`}</div>
    <table><tr><th></th><th>Input</th><th>Expected</th><th>Your result</th></tr>${r.results.map(x => `<tr><td class="${x.ok ? 'ok' : 'bad'}">${x.ok ? '✓' : '✗'}</td><td class="mono">${esc(x.args)}</td><td class="mono">${esc(x.expected)}</td><td class="mono">${esc(x.got)}</td></tr>`).join('')}</table>`; }
  if (r.stdout) h += `<div class="small muted sec">Printed output:</div><pre>${esc(r.stdout)}</pre>`;
  $('#out').innerHTML = h;
}
go('today');
</script>
